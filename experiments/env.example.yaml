# Configuração do banco de provas.
# Copie para env.yaml e ajuste. env.yaml é ignorado pelo git.
#
# Este arquivo contém APENAS os botões que você ajusta entre execuções. Tudo o
# que já está determinado pelo desenho do trabalho (endpoint, os modelos e os
# papéis de cada um, temperatura determinística, limiar) mora no código, no
# registry de `llm.py` e nos defaults de `Environment` — não se repete aqui.
#
# ┌─ O QUE VOCÊ PRECISA PREENCHER PARA RODAR ──────────────────────────────────┐
# │ A CHAVE DE API. Duas formas (a 1ª tem precedência sobre a 2ª):              │
# │   a) variável de ambiente OPENROUTER_API_KEY:                               │
# │        PowerShell:  $env:OPENROUTER_API_KEY = "sk-or-..."                   │
# │        bash:        export OPENROUTER_API_KEY="sk-or-..."                   │
# │   b) campo apiKey abaixo, NO SEU env.yaml — que é gitignorado, então não é  │
# │      versionado. NUNCA preencha a chave no env.example.yaml, que é          │
# │      versionado; deixe-o vazio.                                             │
# │ Nada mais é obrigatório: os campos abaixo já vêm com valores de trabalho.   │
# └────────────────────────────────────────────────────────────────────────────┘
#
# TODA execução chama a API e consome crédito. Não há modo offline: o pipeline
# só existe contra os modelos reais. Confira o custo com
# `pipeline.estimateBatteryCost` e valide a chave com `llm.checkApi` antes de
# disparar a bateria.
#
# Os nomes dos campos acompanham os do `pipeline.Environment` (inglês, camelCase).
# Campo desconhecido levanta erro na carga, em vez de cair calado no padrão.

# Chave da API. Preencha no SEU env.yaml, que é gitignorado — não aqui.
# Se OPENROUTER_API_KEY estiver definida no ambiente, ela tem precedência.
apiKey: ""

# Benchmark da bateria: bipia (primário) | sep | notinject
benchmark: bipia

# Reprodutibilidade
seed: 42

# Amostragem estratificada por (rótulo, tarefa)
sampleSize: 300

# Teto de tokens do FILTRO. A decisão em JSON cabe com folga; o teto existe
# para que toda chamada termine.
maxTokens: 2048

# Teto de geração do COMPONENTE PRINCIPAL. O gpt-oss é modelo de raciocínio:
# gasta o orçamento pensando e, se o teto chega antes do fim, devolve `content`
# VAZIO com finish_reason "length". A 8.192 isso fica restrito a uma pequena
# fração das respostas, que contam como saída inválida (`componentFinish`
# registra o corte).
componentMaxTokens: 8192
